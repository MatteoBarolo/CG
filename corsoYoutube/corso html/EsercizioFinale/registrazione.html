<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione</title>
    <link rel="stylesheet" href="/corso css/global.css"/>
</head>
<body>
    <header>
        <span>SITO ESEMPIO</span>
        <nav>
            <ul>
                <li><a href="homepage.html" target="_self">homepage</a></li>
                <li><a href="articolo.html" target="_self">articolo</a></li>
                <li><a href="registrazione.html" target="_self">registrati </a></li>
            </ul>
        </nav>
    </header>
    <main >
        <h1>Registrazione</h1>
        <form action="#" method="POST">
            <!-- NOME-->
            <div>
            <label>
                Nome
                <input type="text" name="nome" id="nome">
            </label>
            </div>
            <!-- COGNOME-->
            <div>
            <label>
                Cognome
                <input type="text" name="cognome" id="cognome">
            </label>
            </div>
            <!-- EMAIL-->
            <div>
            <label>
                Email
                <input type="email" name="email" id="email">
            </label>
            </div>
            <!-- TELEFONOS-->
            <div>
            <label>
                Telefono
                <input type="telefono" name="telefono" id="telefono">
            </label>
            </div>
            <!-- PASSWORD-->
            <div>
            <label>
                Password
                <input type="password" name="password" id="password">
            </label>
            </div>
            <!-- CONFERMA PASSWORD-->
            <div>
            <label>
                Conferma Password
                <input type="password" name="confirmPassword" id="confirmPassword">
            </label>
            </div>

            <button type ="submit"> Invia</button>
            <button type ="reset"> Cancella</button>

        </form>
        
    </main>
    <footer>
        <nav>
            <ul>
                <li><a href="homepage.html" target="_self">homepage</a></li>
                <li><a href="articolo.html" target="_self">articolo</a></li>
                <li><a href="registrazione.html" target="_self">registrati </a></li>
            </ul>
        </nav>
    </footer>
    
    
</body>
</html>
